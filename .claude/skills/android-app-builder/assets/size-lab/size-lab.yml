name: Size lab

on:
  push:
    branches: ["size-lab"]
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Phase 3 (combination + aapt2 optimize)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          tools/size-lab.sh 1-base-only
          tools/size-lab.sh 3
      - name: Report
        if: always()
        run: |
          cat "$RUNNER_TEMP/size-lab.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Size lab::$(sed -z 's/%/%25/g; s/\n/%0A/g' "$RUNNER_TEMP/size-lab.txt")"
          # Baseline content breakdown via apkanalyzer is not needed: entry sizes are in the table.
